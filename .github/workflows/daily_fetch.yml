name: Daily Price Data Collector

on:
  schedule:
    - cron: '0 14 * * *'  # 매일 한국시간 밤 11시(UTC 14:00) 자동 실행
  workflow_dispatch:      # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run data collection script
        env:
          # Secrets의 ricekey를 Python 환경 변수 ricekey로 전달
          ricekey: ${{ secrets.ricekey }}
        run: python scripts/collect_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/history.json
          git commit -m "chore: update daily price data" || exit 0
          git push
